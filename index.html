    <style>
        :root {
            --carbon: #0D0D0F;
            --grafite: #2C2F33;
            --laranja: #FF6A00;
            --laranja-light: #FF8C3A;
            --branco: #FFFFFF;
            --texto-secundario: #A0A0A0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--carbon);
            color: var(--branco);
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Subtle background pattern for premium feel */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 25% 30%, rgba(255, 106, 0, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 75% 70%, rgba(255, 106, 0, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            text-align: center;
            max-width: 440px;
            padding: 50px 30px;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 2.35rem;
            font-weight: 700;
            letter-spacing: 3.5px;
            color: var(--laranja);
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(255, 106, 0, 0.25);
        }

        .tagline {
            font-size: 0.92rem;
            color: var(--texto-secundario);
            margin-bottom: 45px;
            letter-spacing: 2.2px;
            font-weight: 400;
        }

        .loader-wrapper {
            margin-bottom: 30px;
        }

        .loader {
            border: 3.5px solid var(--grafite);
            border-top: 3.5px solid var(--laranja);
            border-radius: 50%;
            width: 54px;
            height: 54px;
            animation: spin 0.85s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            margin: 0 auto;
            box-shadow:
                0 0 22px rgba(255, 106, 0, 0.3),
                inset 0 0 8px rgba(0, 0, 0, 0.4);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .message {
            font-size: 1.08rem;
            margin-bottom: 12px;
            color: var(--branco);
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .submessage {
            font-size: 0.88rem;
            color: var(--texto-secundario);
            max-width: 280px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .footer-brand {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--grafite);
            letter-spacing: 2.5px;
            font-weight: 500;
        }

        /* Mobile optimization */
        @media (max-width: 480px) {
            .container {
                padding: 40px 20px;
            }

            .logo {
                font-size: 2rem;
                letter-spacing: 2.8px;
            }

            .tagline {
                font-size: 0.85rem;
                margin-bottom: 38px;
            }
        }
    </style>
</head>

        <!-- Messages -->

        <p class="submessage">Preparando uma experiência premium para você.</p>
